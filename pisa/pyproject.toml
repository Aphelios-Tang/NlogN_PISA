[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pisa-attention"
version = "0.1.0"
description = "Pyramid block selection and trainable sparse attention"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
build = ["build", "twine"]
cuda = ["triton>=3.3; sys_platform == 'linux'", "fla-core==0.5.2; sys_platform == 'linux'"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pisa", "pisa.*"]

[tool.setuptools.package-data]
"pisa.ops.flash_sparse_attn.nsa_cmp_select" = ["LICENSE", "OFFICIAL_SOURCE.md"]

[tool.ruff]
line-length = 100
